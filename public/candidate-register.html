<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Candidate Registration Closed | NACOME Election Portal • MOUAU</title>
    <link rel="icon" type="image/png" href="https://portal.mouau.edu.ng/images/logo/mou_logo_c.png"/>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0b6623",
                        "primary-dark": "#074a19",
                        "secondary": "#eab308",
                        "background-light": "#f4f7f4",
                        "background-dark": "#0a160e",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Lexend', sans-serif; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
    <header class="w-full bg-white dark:bg-background-dark border-b-2 border-secondary/50 dark:border-emerald-900 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center hover:opacity-80 transition-opacity">
                <img src="https://portal.mouau.edu.ng/images/logo/mou_logo_c.png" onerror="this.onerror=null;this.src='assets/images/mouau-logo.svg';" alt="MOUAU Logo" class="h-11 w-auto"/>
            </a>
            <nav class="hidden md:flex items-center gap-8">
                <a class="text-sm font-medium hover:text-primary transition-colors" href="index.html">Home</a>
                <a class="text-sm font-medium hover:text-primary transition-colors" href="candidates.html">Candidates</a>
                <a class="text-sm font-medium hover:text-primary transition-colors" href="results.html">Results</a>
            </nav>
            <div class="flex items-center gap-4">
                <a href="login.html" class="text-sm font-semibold text-primary hover:bg-primary/5 px-4 py-2 rounded-lg transition-all">
                    Student Login
                </a>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6">
        <div class="max-w-lg w-full bg-white dark:bg-slate-900 rounded-2xl shadow-xl shadow-primary/5 border border-slate-200 dark:border-slate-800 p-8 sm:p-10 text-center">
            <div class="size-20 rounded-full bg-red-50 dark:bg-red-950/30 border border-red-200 dark:border-red-900/50 flex items-center justify-center mx-auto mb-6">
                <span class="material-symbols-outlined text-red-600 dark:text-red-400 text-4xl">lock</span>
            </div>
            <span class="inline-block px-3 py-1 rounded-full bg-red-100 dark:bg-red-950/40 text-red-700 dark:text-red-300 text-xs font-bold uppercase tracking-widest mb-4">
                Registration Closed
            </span>
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white mb-3">
                Candidate Registration Is Disabled
            </h1>
            <p class="text-sm sm:text-base text-slate-600 dark:text-slate-400 mb-8 leading-relaxed">
                Candidate registration is closed because the election is currently ongoing. New candidate submissions are no longer accepted.
            </p>
            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <a href="candidates.html" class="bg-primary hover:bg-primary-dark text-white font-bold px-6 py-3 rounded-xl transition-all flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-lg">groups</span>
                    View Candidates
                </a>
                <a href="index.html" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 font-bold px-6 py-3 rounded-xl transition-all flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-lg">home</span>
                    Back to Home
                </a>
            </div>
        </div>
    </main>
</body>
</html>
